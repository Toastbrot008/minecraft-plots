  }
  const gm = $("#goMine"); if (gm) gm.onclick = () => setTab("mine");
  const s = $("#search"); if (s) s.oninput = e => { S.search = e.target.value; const pos = e.target.selectionStart; renderTeams(); const n = $("#search"); n.focus(); n.setSelectionRange(pos, pos); };
  el.querySelectorAll(".item").forEach(b => b.onclick = () => select(b.dataset.id, true));
}

/* ---------- mine pane ---------- */
function newDraft(from){
  const used = new Set(S.claims.map(c => c.color));
  return {
    team: from ? from.team : "",
    color: from ? from.color : (COLORS.find(c => !used.has(c)) || COLORS[0]),
    members: from ? memberList([from.members, from.invited].filter(Boolean).join(", ")).filter(n => n.toLowerCase() !== S.meName.toLowerCase()).join(", ") : "",
    note: from ? from.note || "" : ""
  };
}
function budgetIcon(color){
  return `<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><polygon points="12,16 30,8 46,18 44,38 28,48 10,36" fill="${esc(color)}" fill-opacity=".3" stroke="${esc(color)}" stroke-width="2.4" stroke-dasharray="5 3" stroke-linejoin="round"/></svg>`;
}
function renderMine(){
  const el = $("#pane-mine"), mine = myClaim(), st = S.settings;
  if (!S.db){ el.innerHTML = `<h2>Mein Gebiet</h2><div class="note warn">Der Server ist gerade nicht erreichbar. Lade die Seite gleich neu.</div>`; return; }
  if (!S.loaded){ el.innerHTML = `<h2>Mein Gebiet</h2><p class="muted">Wird geladen…</p>`; return; }
  if (S.unpaid && !mine){ el.innerHTML = `<h2>Mein Gebiet</h2><div class="note info">Deine Zahlung ist noch nicht eingetragen. Du kannst dir die Karte ansehen, ein Gebiet claimen geht aber erst nach der Zahlung.</div>`; return; }
  const open = claimsOpen() && !S.unpaid;
  // Hat dich jemand ins Team eingetragen, gibt es nichts mehr zu claimen
  if (mine && S.draft && !S.draft.editing && !S.placing) S.draft = null;

  if (mine && !S.draft){
    const budget = budgetFor(mine.players);
    let html = `<div class="detail" style="--c:${esc(mine.color)}">
      ${mine.status === "pending" ? `<span class="tag pending">Wartet auf Freigabe</span>` : `<span class="tag mine">Euer Gebiet</span>`}
      <h2>${esc(mine.team)}</h2>
      <dl>${claimFacts(mine)}<dt>Erlaubt</dt><dd>${fmt(budget)} Blöcke Grenze</dd>${mine.note ? `<dt>Plan</dt><dd>${esc(mine.note)}</dd>` : ""}</dl>
      <div class="btns">
        <button class="btn small" id="mShow">Auf Karte zeigen</button>
        ${open ? `<button class="btn small" id="mEdit">Bearbeiten</button><button class="btn small" id="mMove">Grenzen ändern</button>${mine.id === S.uid ? `<button class="btn small danger" id="mDel">Gebiet freigeben</button>` : ""}` : ""}
        ${mine.id !== S.uid && claimsOpen() ? `<button class="btn small danger" id="mLeave">Team verlassen</button>` : ""}
      </div>
    </div>`;
    if (!open) html += `<div class="note info">${S.unpaid ? "Du bist in diesem Team, kannst das Gebiet aber erst nach deiner Zahlung bearbeiten." : "Das Claimen ist geschlossen. Änderungen gehen nur noch über einen Admin."}</div>`;
    el.innerHTML = html;
    $("#mShow").onclick = () => select(mine.id, true);
    const ml = $("#mLeave");
    if (ml) armConfirm(ml, "Ja, Team verlassen", async () => {
      try{ await S.user.leaveTeam(mine.id); toast("Du hast das Team verlassen"); S.selected = null; }catch(e){ toast(errMsg(e)); }
    });
    if (open){
      $("#mEdit").onclick = () => { S.draft = newDraft(mine); S.draft.editing = true; renderMine(); };
      $("#mMove").onclick = () => { S.draft = newDraft(mine); startDrawing({ targetId: mine.id, players: mine.players, color: mine.color, pts: mine.pts }); };
      if ($("#mDel")) armConfirm($("#mDel"), "Ja, wirklich freigeben", async () => {
        try{ await S.db.doc("claims/" + mine.id).delete(); toast("Gebiet freigegeben"); S.selected = null; }catch(e){ toast(errMsg(e)); }
      });
    }
    return;
  }

  const invites = mine ? [] : S.claims.filter(c => c.inviteIds.includes(S.uid));
  if (invites.length && !S.skipInvites){
    el.innerHTML = `<h2>Einladungen</h2><p class="lead">Du wurdest in ein Team eingetragen. Nimmst du an, gehörst du zu diesem Gebiet und kannst kein eigenes mehr erstellen.</p>` +
      invites.map(c => `<div class="detail" style="--c:${esc(c.color)}"><h2>${esc(c.team)}</h2><dl>${claimFacts(c)}</dl>
        <div class="btns"><button class="btn small primary" data-acc="${esc(c.id)}">Annehmen</button><button class="btn small" data-dec="${esc(c.id)}">Ablehnen</button></div></div>`).join("") +
      (open ? `<div class="btns"><button class="btn small" id="iOwn">Lieber ein eigenes Gebiet claimen</button></div>` : "");
    el.querySelectorAll("[data-acc]").forEach(b => b.onclick = async () => {
      try{ await S.user.answerInvite(b.dataset.acc, true); toast("Willkommen im Team"); }catch(e){ toast(errMsg(e)); } });
    el.querySelectorAll("[data-dec]").forEach(b => b.onclick = async () => {
      try{ await S.user.answerInvite(b.dataset.dec, false); toast("Einladung abgelehnt"); }catch(e){ toast(errMsg(e)); } });
    const own = $("#iOwn"); if (own) own.onclick = () => { S.skipInvites = true; renderMine(); };
    return;
  }

  if (!open && !mine){ el.innerHTML = `<h2>Mein Gebiet</h2><div class="note info">Das Claimen ist gerade geschlossen. Schau dir trotzdem an, wo die anderen Teams bauen.</div>`; return; }

  if (!S.draft) S.draft = newDraft();
  const d = S.draft, cur = mine ? mine.id : S.uid;
  const sizeHtml = () => {
    const budget = budgetFor(teamSize(d.members)), side = budget / 4;
    return `${budgetIcon(d.color)}<div><b>${fmt(budget)} Blöcke Grenzlänge</b><span>So lang darf eure Grenze insgesamt sein. Das reicht z. B. für ein Quadrat von ${fmt(side)} × ${fmt(side)} Blöcken. Mehr Spieler, mehr Grenze.</span></div>`;
  };
  const countText = () => { const inv = teamTotal(d.members) - teamSize(d.members);
    return `${teamSize(d.members)} von ${st.maxPlayers} Spielern${inv ? ` + ${inv} eingeladen` : ""}`; };
  let html = `<h2>${d.editing ? "Gebiet bearbeiten" : "Gebiet claimen"}</h2>
  <p class="lead">${d.editing ? "Ändert Name, Mitglieder oder Farbe." : "Gebt euer Team an, dann zieht ihr eure Grenzen direkt auf der Karte."}</p>
  <label class="f"><span>Teamname</span><input type="text" id="fTeam" maxlength="32" value="${esc(d.team)}" placeholder="z. B. Die Redstone-Bande" autocomplete="off"></label>
  <label class="f"><span>Weitere Mitglieder</span><input type="text" id="fMembers" maxlength="400" value="${esc(d.members)}" placeholder="Namen tippen oder aus der Liste wählen">
    <small>Du (${esc(S.meName)}) bist automatisch dabei. Neu Eingetragene bekommen eine Einladung und sind erst im Team (und zählen für die Grenzlänge), wenn sie annehmen. Eintragen kannst du jeden, der sich schon einmal angemeldet hat. <b id="fCount">${countText()}</b></small></label>
  <div class="sizebox" id="fSize">${sizeHtml()}</div>
  <label class="f"><span>Teamfarbe</span></label>
  <div class="colors" role="group" aria-label="Teamfarbe" style="margin:-8px 0 16px">${COLORS.map(c => `<button type="button" style="background:${c}" data-c="${c}" aria-pressed="${c === d.color}" aria-label="Farbe ${c}"></button>`).join("")}</div>
  <label class="f"><span>Was baut ihr? <span class="muted" style="font-weight:400">(optional)</span></span><textarea id="fNote" maxlength="200" placeholder="z. B. Hafenstadt mit Leuchtturm">${esc(d.note)}</textarea></label>
  <div id="fErr"></div>
  <div class="btns">
    ${d.editing ? `<button class="btn" id="fCancel">Abbrechen</button><button class="btn primary" id="fSave">Änderungen speichern</button>` : `<button class="btn primary wide" id="fPlace">Grenzen auf der Karte ziehen</button>`}
  </div>`;
  el.innerHTML = html;

  const sync = () => { d.team = $("#fTeam").value; d.members = $("#fMembers").value; d.note = $("#fNote").value; };
  for (const id of ["#fTeam", "#fMembers", "#fNote"]) $(id).addEventListener("input", sync);
  $("#fMembers").addEventListener("input", () => { $("#fSize").innerHTML = sizeHtml(); $("#fCount").textContent = countText(); });
  nameSuggest($("#fMembers"), cur);
  el.querySelectorAll(".colors button").forEach(b => b.onclick = () => { sync(); d.color = b.dataset.c; renderMine(); });
  const validate = () => {
    sync();
    const name = d.team.trim();
    if (name.length < 2) return "Gib einen Teamnamen mit mindestens 2 Zeichen ein.";
    const dup = S.claims.find(c => c.id !== cur && c.team.trim().toLowerCase() === name.toLowerCase());
    if (dup) return "Den Teamnamen „" + dup.team + "“ gibt es schon.";
    const own = mine ? memberList(mine.members).map(n => n.toLowerCase()) : [];
    for (const n of memberList(d.members)){
      const low = n.toLowerCase();
      if (S.mcNames.length && !own.includes(low) && !S.mcNames.some(x => x.toLowerCase() === low)) return "„" + n + "“ hat sich noch nie angemeldet. Nimm einen Namen aus den Vorschlägen.";
      const other = S.claims.find(c => c.id !== cur && memberList(c.members).some(x => x.toLowerCase() === low));
      if (other) return "„" + n + "“ ist schon im Team „" + other.team + "“.";
    }
    const size = teamTotal(d.members);
    if (size > st.maxPlayers) return "Ein Team darf höchstens " + st.maxPlayers + " Spieler haben, ihr wärt " + size + ".";
    if (size < st.minPlayers) return "Ein Team braucht mindestens " + st.minPlayers + " Spieler, ihr seid " + size + ".";
    return null;
  };
  const showErr = m => { $("#fErr").innerHTML = m ? `<div class="note warn">${esc(m)}</div>` : ""; };
  const fp = $("#fPlace");
  if (fp) fp.onclick = () => { const m = validate(); showErr(m); if (!m) startDrawing({ targetId: cur, players: teamSize(d.members), color: d.color }); };
  const fc = $("#fCancel"); if (fc) fc.onclick = () => { S.draft = null; renderMine(); };
  const fs = $("#fSave");
  if (fs) fs.onclick = async () => {
    const m = validate(); if (m) return showErr(m);
    const size = teamSize(d.members), budget = budgetFor(size);
    if (mine.perim > budget + 0.5) return showErr(`Mit ${size} Spielern habt ihr ${fmt(budget)} Blöcke Grenze, eure ist aber ${fmt(mine.perim)} lang. Macht zuerst über „Grenzen ändern“ euer Gebiet kleiner.`);
    fs.disabled = true;
    try{
      await S.db.doc("claims/" + mine.id).update({ team: d.team.trim(), color: d.color, members: cleanMembers(d.members), note: d.note.trim(), updatedAt: Date.now() });
      S.draft = null; toast("Änderungen gespeichert"); renderMine();
    }catch(e){ fs.disabled = false; showErr(errMsg(e)); }
  };
}

/* ---------- admin pane ---------- */
function renderAdmin(){
  const el = $("#pane-admin");
  if (!S.isAdmin){ el.innerHTML = ""; return; }
  if (!S.adminDraft) S.adminDraft = { ...S.settings };
  const a = S.adminDraft, bad = overlaps();
  const ratioImg = S.imgRatio, ratioB = (a.maxZ - a.minZ) / (a.maxX - a.minX);
  const ratioWarn = ratioImg && Math.abs(ratioImg - ratioB) > 0.02;
  const num = (id, label, val, hint, step = 1) => `<label class="f"><span>${label}</span><input type="number" id="${id}" value="${esc(val)}" step="${step}">${hint ? `<small>${hint}</small>` : ""}</label>`;
  const bMin = budgetFor(+a.minPlayers, a), bMax = budgetFor(+a.maxPlayers, a);

  let html = `<h2>Admin</h2><p class="lead">Einstellungen gelten für alle sofort nach dem Speichern.</p>`;
  html += `<section class="adm-sec"><h3>Anmeldung</h3>
    <label class="switch"><input type="checkbox" id="aOpen" ${a.open ? "checked" : ""}><span><b>Gebiete können geclaimt werden</b><small>Aus heißt: Spieler sehen die Karte, können aber nichts ändern.</small></span></label>
    <label class="switch"><input type="checkbox" id="aAppr" ${a.requireApproval ? "checked" : ""}><span><b>Neue Gebiete erst nach Freigabe</b><small>Neue Gebiete erscheinen gepunktet, bis ihr sie bestätigt.</small></span></label>
    <label class="f"><span>Anmeldeschluss</span><input type="datetime-local" id="aDeadline" value="${esc(a.deadline)}"><small>Leer lassen für kein automatisches Ende.</small></label>
    <label class="f"><span>Serverstart</span><input type="datetime-local" id="aStart" value="${esc(a.start)}"><small>Steuert den Countdown oben.</small></label>
  </section>`;
  html += `<section class="adm-sec"><h3>Teams und Grenzlänge</h3>
    <div class="row2">${num("aMinP", "Min. Spieler", a.minPlayers)}${num("aMaxP", "Max. Spieler", a.maxPlayers)}</div>
    <div class="row2">${num("aBase", "Grundlänge", a.baseBorder, "Blöcke Grenze pro Team", 10)}${num("aPer", "Pro Spieler", a.perPlayerBorder, "Blöcke Grenze zusätzlich", 10)}</div>
    ${num("aGap", "Mindestabstand zwischen Gebieten", a.minGap, "In Blöcken")}
    <p class="muted" style="font-size:.85rem;margin:-4px 0 0">${a.minPlayers} Spieler: ${fmt(bMin)} Blöcke Grenze, etwa ${fmt(bMin / 4)} × ${fmt(bMin / 4)} als Quadrat. ${a.maxPlayers} Spieler: ${fmt(bMax)} Blöcke, etwa ${fmt(bMax / 4)} × ${fmt(bMax / 4)}.</p>
  </section>`;
  html += `<section class="adm-sec"><h3>Spawn-Schutzzone</h3>
    <div class="row3">${num("aSX", "Spawn X", a.spawnX)}${num("aSZ", "Spawn Z", a.spawnZ)}${num("aSR", "Radius", a.spawnR)}</div>
  </section>`;
  html += `<section class="adm-sec"><h3>Karte</h3>
    <img class="mapthumb" src="${esc(a.mapAssetId ? "/_blob/" + a.mapAssetId : T.idx ? "terrain/overview.webp" : DEFAULT_MAP)}" alt="Aktuelle Karte">
    <div class="btns" style="margin:0 0 14px">
      ${S.assets ? `<label class="btn small">Neue Karte hochladen<input type="file" id="aFile" accept="image/png,image/jpeg,image/webp" hidden></label>` : ""}
      ${a.mapAssetId ? `<button class="btn small" id="aDefMap">${T.idx ? "Gerenderte Welt" : "Ursprüngliche Karte"}</button>` : ""}
    </div>
    ${S.assets ? "" : `<div class="note info">Hochladen geht nur für Bearbeiter der Seite.</div>`}
    <p class="muted" style="font-size:.85rem;margin:0 0 10px">Gib die Minecraft-Koordinaten der Bildränder an, damit Koordinaten und Grenzlängen stimmen.</p>
    <div class="row2">${num("aMinX", "Links (min. X)", a.minX)}${num("aMaxX", "Rechts (max. X)", a.maxX)}</div>
    <div class="row2">${num("aMinZ", "Oben (min. Z)", a.minZ)}${num("aMaxZ", "Unten (max. Z)", a.maxZ)}</div>
    ${ratioWarn ? `<div class="note warn">Das Bild ist ${ratioImg > ratioB ? "höher" : "breiter"} als der eingetragene Bereich und wird verzerrt. <button class="btn small" id="aFixRatio" style="margin-top:8px">Unten (max. Z) anpassen</button></div>` : ""}
  </section>`;
  html += `<section class="adm-sec"><h3>Texte</h3>
    <label class="f"><span>Titel</span><input type="text" id="aTitle" maxlength="48" value="${esc(a.title)}"></label>
    <label class="f"><span>Untertitel</span><input type="text" id="aSub" maxlength="120" value="${esc(a.subtitle)}"></label>
  </section>
  <div class="btns savebar">
    <button class="btn primary" id="aSave">Speichern</button>
    <button class="btn" id="aReset">Verwerfen</button>
  </div>`;

  html += `<section class="adm-sec"><h3>Alle Gebiete (${S.claims.length})</h3>`;
  if (!S.claims.length) html += `<p class="muted">Noch keine Gebiete.</p>`;
  const sorted = [...S.claims].sort((x, y) => (y.status === "pending") - (x.status === "pending") || x.team.localeCompare(y.team, "de"));
  for (const c of sorted){
    const who = S.names[c.id], overB = c.perim > budgetFor(c.players) + 0.5;
    html += `<div class="admrow"><span class="sw" style="background:${esc(c.color)}"></span>
      <div class="grow"><div class="nm">${esc(c.team)}</div><div class="meta">${c.players} Spieler, ${fmt(c.perim)} von ${fmt(budgetFor(c.players))} Blöcken Grenze${who ? ", von " + esc(who) : ""}</div></div>
      ${bad.has(c.id) ? `<span class="tag warn">überschneidet</span>` : overB ? `<span class="tag warn">zu lang</span>` : c.status === "pending" ? `<span class="tag pending">offen</span>` : ""}
      <button class="btn small" data-edit="${esc(c.id)}">${S.adminEdit === c.id ? "Schließen" : "Bearbeiten"}</button>
    </div>`;
    if (S.adminEdit === c.id){
      html += `<div class="admedit">
        <div class="row2"><label class="f"><span>Teamname</span><input type="text" id="eTeam" value="${esc(c.team)}" maxlength="32"></label>${num("ePlayers", "Spieler", c.players)}</div>
        <label class="f"><span>Teamfarbe</span><select id="eColor">${COLORS.map(x => `<option value="${x}" ${x === c.color ? "selected" : ""}>${x}</option>`).join("")}</select></label>
        <label class="f"><span>Mitglieder</span><input type="text" id="eMembers" value="${esc(c.members)}" maxlength="400"></label>
        <label class="f"><span>Was bauen sie?</span><input type="text" id="eNote" value="${esc(c.note)}" maxlength="200"></label>
        <label class="f"><span>Besitzer</span><select id="eOwner">
          ${S.accounts.some(u => u.id === c.id) ? "" : `<option value="" selected>Kein Konto</option>`}
          ${S.accounts.filter(u => c.memberIds.includes(u.id) || !S.claims.some(x => x.memberIds.includes(u.id))).map(u => `<option value="${esc(u.id)}" ${u.id === c.id ? "selected" : ""}>${esc(u.name)}</option>`).join("")}
        </select><small>Zur Auswahl stehen dieses Team und Konten ohne Gebiet.</small></label>
        <div class="btns">
          ${c.status === "pending" ? `<button class="btn small primary" data-approve="${esc(c.id)}">Freigeben</button>` : `<button class="btn small" data-unapprove="${esc(c.id)}">Freigabe zurücknehmen</button>`}
          <button class="btn small" data-save="${esc(c.id)}">Speichern</button>
          <button class="btn small" data-border="${esc(c.id)}">Grenzen bearbeiten</button>
          <button class="btn small" data-show="${esc(c.id)}">Auf Karte</button>
          <button class="btn small danger" data-del="${esc(c.id)}">Löschen</button>
        </div>
      </div>`;
    }
  }
  html += `</section>`;
  if (S.claims.length && S.downloads) html += `<div class="btns"><button class="btn small" id="aCsv">Liste als CSV herunterladen</button></div>`;
  el.innerHTML = html;

  const ids = { aDeadline:"deadline", aStart:"start", aMinP:"minPlayers", aMaxP:"maxPlayers", aBase:"baseBorder", aPer:"perPlayerBorder", aGap:"minGap", aSX:"spawnX", aSZ:"spawnZ", aSR:"spawnR", aMinX:"minX", aMaxX:"maxX", aMinZ:"minZ", aMaxZ:"maxZ", aTitle:"title", aSub:"subtitle" };
  const numeric = new Set(["minPlayers","maxPlayers","baseBorder","perPlayerBorder","minGap","spawnX","spawnZ","spawnR","minX","maxX","minZ","maxZ"]);
  for (const [id, key] of Object.entries(ids)){
    const inp = $("#" + id);
    inp.onchange = () => { a[key] = numeric.has(key) ? Number(inp.value) : inp.value; renderAdmin(); };
  }
  $("#aOpen").onchange = e => a.open = e.target.checked;
  $("#aAppr").onchange = e => a.requireApproval = e.target.checked;
  $("#aReset").onclick = () => { S.adminDraft = { ...S.settings }; renderAdmin(); };
  $("#aSave").onclick = saveSettings;
  const fr = $("#aFixRatio"); if (fr) fr.onclick = () => { a.maxZ = Math.round(a.minZ + (a.maxX - a.minX) * ratioImg); renderAdmin(); };
  const dm = $("#aDefMap"); if (dm) dm.onclick = () => { a.mapAssetId = ""; measureImg(DEFAULT_MAP); renderAdmin(); };
  const file = $("#aFile");
  if (file) file.onchange = async () => {
    const f = file.files[0]; if (!f) return;
    toast("Karte wird hochgeladen…");
    try{ const res = await S.assets.upload(f); a.mapAssetId = res.id; measureImg(res.url); toast("Karte hochgeladen. Speichern nicht vergessen."); renderAdmin(); }
    catch(e){ toast("Hochladen fehlgeschlagen: " + (e && e.message || "unbekannter Fehler")); }
  };
  if ($("#eMembers")) nameSuggest($("#eMembers"), S.adminEdit);
  el.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { S.adminEdit = S.adminEdit === b.dataset.edit ? null : b.dataset.edit; renderAdmin(); });
  el.querySelectorAll("[data-show]").forEach(b => b.onclick = () => select(b.dataset.show, true));
  el.querySelectorAll("[data-approve]").forEach(b => b.onclick = () => adminUpdate(b.dataset.approve, { status: "approved" }, "Gebiet freigegeben"));
  el.querySelectorAll("[data-unapprove]").forEach(b => b.onclick = () => adminUpdate(b.dataset.unapprove, { status: "pending" }, "Freigabe zurückgenommen"));
  el.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
    const id = b.dataset.save, owner = $("#eOwner").value;
    const c = S.claims.find(x => x.id === id), players = Math.max(1, +$("#ePlayers").value || 1);
    await adminUpdate(id, { ...(c && players !== c.players ? { players } : {}), team: $("#eTeam").value.trim() || "Team", color: $("#eColor").value, members: cleanMembers($("#eMembers").value), note: $("#eNote").value.trim() }, "Gebiet gespeichert");
    if (!owner || owner === id) return;
    try{ await S.user.moveClaim(id, owner); S.adminEdit = owner; if (S.selected === id) S.selected = owner; delete S.names[owner]; toast("Gebiet gehört jetzt dem neuen Konto"); await loadAccounts(); }
    catch(e){ toast(errMsg(e)); }
  });
  el.querySelectorAll("[data-border]").forEach(b => b.onclick = () => {
    const c = S.claims.find(x => x.id === b.dataset.border); if (!c) return;
    startDrawing({ targetId: c.id, players: c.players, color: c.color, pts: c.pts, isAdminEdit: true });
  });
  el.querySelectorAll("[data-del]").forEach(b => armConfirm(b, "Ja, wirklich löschen", async () => {
    const c = S.claims.find(x => x.id === b.dataset.del); if (!c) return;
    try{ await S.db.doc("claims/" + c.id).delete(); S.adminEdit = null; toast("Gebiet „" + c.team + "“ gelöscht"); }catch(e){ toast(errMsg(e)); }
  }));
  const csv = $("#aCsv"); if (csv) csv.onclick = exportCsv;
}
async function adminUpdate(id, patch, msg){
  try{ await S.db.doc("claims/" + id).update({ ...patch, updatedAt: Date.now() }); toast(msg); }catch(e){ toast(errMsg(e)); }
}
async function saveSettings(){
  const a = S.adminDraft;
  if (a.maxX <= a.minX || a.maxZ <= a.minZ) return toast("Die Kartenränder passen nicht: max. muss größer als min. sein.");
  if (a.maxPlayers < a.minPlayers || a.minPlayers < 1) return toast("Min. und max. Spieler passen nicht zusammen.");
  const clean = {};
  for (const k of Object.keys(DEFAULTS)) clean[k] = a[k] ?? DEFAULTS[k];
  try{ await S.db.doc("settings/main").set(clean); toast("Einstellungen gespeichert"); }catch(e){ toast(errMsg(e)); }
}
async function exportCsv(){
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Team","Spieler","Mitglieder","Mitte X","Mitte Z","Grenzlänge","Fläche","Status","Geclaimt von","Plan","Grenzpunkte"]]
    .concat(S.claims.map(c => [c.team, c.players, c.members, c.cx, c.cz, Math.round(c.perim), Math.round(c.area), c.status === "pending" ? "offen" : "freigegeben", S.names[c.id] || "", c.note, c.pts.map(p => p[0] + " " + p[1]).join(" | ")]));
  try{ await S.downloads.save({ filename: "gebiete.csv", data: "\ufeff" + rows.map(r => r.map(q).join(";")).join("\n") }); }catch(e){}
}
function measureImg(src){
  if (src === DEFAULT_MAP && T.idx){ S.imgRatio = null; return; }   // Gelände liegt in echten Koordinaten
  const im = new Image();
  im.onload = () => { S.imgRatio = im.naturalHeight / im.naturalWidth; if (S.isAdmin) renderAdmin(); };
  im.src = src;
}

/* ---------- data ---------- */
function onSettings(snap){
  const data = snap.exists ? snap.data() : {};
  S.settings = { ...DEFAULTS, ...data };
  const bkey = [S.settings.minX, S.settings.maxX, S.settings.minZ, S.settings.maxZ].join(",");
  const boundsChanged = onSettings.bkey !== bkey; onSettings.bkey = bkey;
  if (!S.adminDraft || boundsChanged) S.adminDraft = { ...S.settings };
  drawMapBase(); renderHeader();
  if (boundsChanged) fit();
  measureImg(mapSrc());
  drawPlots();
  if (!typing("#pane-teams")) renderTeams();
  if (!typing("#pane-mine")) renderMine();
  if (!typing("#pane-admin")) renderAdmin();
}
function normClaim(id, v){
  let pts = Array.isArray(v.pts) ? v.pts.map(p => [Math.round(+p.x || 0), Math.round(+p.z || 0)]) : [];
  if (pts.length < 3) pts = circlePts(+v.x || 0, +v.z || 0, +v.r || 40);
  const c = centroid(pts);
  return {
    id, pts, bb: bbox(pts), area: area(pts), perim: perim(pts, true), cx: Math.round(c[0]), cz: Math.round(c[1]),
    memberIds: Array.isArray(v.memberIds) && v.memberIds.length ? v.memberIds : [id],
    team: String(v.team || "Team"), players: Math.max(1, +v.players || 1), color: COLORS.includes(v.color) ? v.color : "#F4C04E",
    members: String(v.members || ""), note: String(v.note || ""),
    inviteIds: Array.isArray(v.inviteIds) ? v.inviteIds : [], invited: String(v.invited || ""), status: v.status === "pending" ? "pending" : "approved"
  };
}
function onClaims(snap){
  S.loaded = true; S.slow = false;
  S.claims = snap.docs.filter(d => d.exists).map(d => normClaim(d.id, d.data()));
  if (S.selected && !S.claims.some(c => c.id === S.selected)) S.selected = null;
  if (S.placing && S.placing.closed){ revalidate(); updateBudget(); }
  drawPlots();
  if (!typing("#pane-teams")) renderTeams();
  if ((!S.draft || !S.draft.editing) && !typing("#pane-mine")) renderMine();
  if (S.isAdmin){ if (!typing("#pane-admin")) renderAdmin(); renderAccounts(); }
  resolveNames();
}

async function init(){
  const [db, user, assets, downloads] = await Promise.all(["db", "user", "assets", "downloads"].map(n => window.claude.use(n).catch(() => null)));
  const me = await user.me().catch(() => ({ id: null }));
  if (!me.id) return showGate(user, me);
  $("#shell").hidden = false;
  S.db = db; S.user = user; S.assets = assets; S.downloads = downloads;
  S.uid = me.id; S.meName = me.name; S.isAdmin = me.isAdmin; S.unpaid = !me.paid;
  setupAuth(me); loadTerrain(); loadNames();
  drawMapBase(); renderHeader(); fit(); drawPlots(); renderTeams(); renderMine();
  document.querySelector('[data-tab="admin"]').hidden = !S.isAdmin;
  document.querySelector('[data-tab="accounts"]').hidden = !S.isAdmin;
  if (S.isAdmin) loadAccounts();
  const timer = setTimeout(() => { if (!S.loaded){ S.slow = true; renderTeams(); } }, 10000);
  db.doc("settings/main").onSnapshot(onSettings, () => {});
  db.collection("claims").onSnapshot(s => { clearTimeout(timer); onClaims(s); }, () => { clearTimeout(timer); S.loaded = true; S.slow = true; renderTeams(); });
  renderMine(); renderAdmin();
}
init();
</script>
<script>
/* ---------- Design-Zusatz (nur Optik) ----------
   Blendet das Seitenblatt ein und aus, versteckt es beim Einzeichnen, füllt den Bildschirm beim Start
   mit der Karte und rückt ein ausgewähltes Gebiet neben das Blatt. Liest nur den Zustand und ruft
   vorhandene Funktionen auf (setTab, stopDrawing, flyTo, applyVB); die Logik oben bleibt unverändert. */
(() => {
  const body = document.body, panel = document.querySelector(".panel"), nav = document.querySelector(".tabs");
  const mobile = () => matchMedia("(max-width: 860px)").matches;
  const isOpen = () => body.classList.contains("sheet-open");
  function aimAtTab(){
    const t = document.querySelector('.tab[aria-selected="true"]:not([hidden])'); if (!t) return;
    const r = t.getBoundingClientRect();
    const [dx, dy] = (panel.style.translate || "0px 0px").split(" ").map(v => parseFloat(v) || 0);
    panel.style.setProperty("--ox", (r.left + r.width / 2 - panel.offsetLeft - dx) + "px");
    panel.style.setProperty("--oy", (r.top + r.height / 2 - panel.offsetTop - (dy || 0)) + "px");
  }
  const setSheet = on => { aimAtTab(); body.classList.toggle("sheet-open", on); };
  addEventListener("resize", aimAtTab);

  // Tab antippen öffnet das Blatt, derselbe Tab nochmal schließt es
  let wasActive = false;
  nav.addEventListener("click", e => { const t = e.target.closest(".tab"); wasActive = !!t && isOpen() && t.getAttribute("aria-selected") === "true"; }, true);
  nav.addEventListener("click", e => { if (e.target.closest(".tab")) setSheet(!wasActive); });
  document.getElementById("sheetX").onclick = () => { setSheet(false); if (S.selected) select(null); };

  // Wechselt das Skript selbst den Tab (z. B. „Gebiet claimen“), geht das Blatt auf
  new MutationObserver(ms => { if (ms.some(m => m.target.classList.contains("pane") && !m.target.hidden)) setSheet(true); })
    .observe(panel, { subtree: true, attributes: true, attributeFilter: ["hidden"] });

  // Gebiet auf der Karte angetippt: Blatt mit den Details öffnen; Tipp ins Leere schließt es
  let lastSel = null;
  new MutationObserver(() => { if (S.selected && S.selected !== lastSel) setSheet(true); lastSel = S.selected; })
    .observe(document.getElementById("pane-teams"), { childList: true });
  document.getElementById("map").addEventListener("pointerup", () => {
    if (!moved && !S.placing && !S.selected && ptrs.size === 0) setSheet(false);
  });

  // Beim Einzeichnen nur Karte und Zeichenleiste zeigen
  const banner = document.getElementById("banner");
  new MutationObserver(() => body.classList.toggle("drawing", banner.classList.contains("on")))
    .observe(banner, { attributes: true, attributeFilter: ["class"] });

  // Esc: Einzeichnen abbrechen oder Blatt schließen
  addEventListener("keydown", e => {
    if (e.key !== "Escape" || document.querySelector("dialog[open]") || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    if (S.placing) stopDrawing(); else setSheet(false);
  });

  // Ausgewähltes Gebiet in die Mitte des freien Bereichs neben/über dem Blatt fliegen
  function fitClaim(c){
    const W = innerWidth, H = innerHeight;
    const ins = !isOpen() ? { l: 0, b: 0 } : mobile() ? { l: 0, b: H - panel.offsetTop } : { l: panel.offsetLeft + panel.offsetWidth, b: 0 };
    const b = c.bb, visW = Math.max(120, W - ins.l), visH = Math.max(120, H - ins.b);
    const w = Math.max((b.x1 - b.x0) * 2.4 * W / visW, (b.z1 - b.z0) * 2.4 / aspect() * H / visH, 240), h = w * aspect();
    flyTo((b.x0 + b.x1) / 2 - ins.l / 2 * w / W, (b.z0 + b.z1) / 2 + ins.b / 2 * h / H, w);
  }
  document.addEventListener("click", e => {
    if (!e.target.closest(".item, #mShow, [data-show]")) return;
    const c = S.claims.find(x => x.id === S.selected); if (c) fitClaim(c);
  });

})();

/* ---------- Fenster verschieben und Vorschau vergrößern ----------
   Kopf, Konto, Zoom, Seitenblatt und Tab-Leiste lassen sich am Griff verschieben (Kopf auch als Ganzes).
   Die Verschiebung ist ein CSS-translate, die Lage aus dem Layout bleibt also die Grundlage.
   Doppelklick auf den Griff setzt ein Fenster zurück. Gemerkt wird alles pro Browser. */
(() => {
  const KEY = "elsmpWindows", PVKEY = "elsmpPreviewWidth";
  const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const save = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const small = () => matchMedia("(max-width: 860px)").matches;
  const pos = load(KEY) || {};
  const KEEP = n => n !== "blatt";   // das Seitenblatt startet immer an seinem Platz
  delete pos.blatt;
  const WINS = { top: ".top", konto: ".corner", zoom: ".mapctl", blatt: ".panel", tabs: ".tabs" };
  const M = 8; // Mindestabstand zum Rand
  const saveAll = () => save(KEY, Object.fromEntries(Object.entries(pos).filter(([n]) => KEEP(n))));

  function apply(name, el){
    const p = pos[name];
    if (small() || !p){ el.style.translate = ""; return; }
    el.style.translate = `${p.x}px ${p.y}px`;
  }
  // Fenster komplett im Bild halten. Gemessen ohne die Animation des Blatts (offsetLeft/Width).
  function clamp(name, el){
    const p = pos[name]; if (!p || small()) return;
    const l = el.offsetLeft, t = el.offsetTop, w = el.offsetWidth, h = el.offsetHeight;
    const r = getComputedStyle(el).transform; // Tab-Leiste ist per translateX(-50%) zentriert
    const tx = r && r !== "none" && !el.classList.contains("panel") ? new DOMMatrix(r).m41 : 0;
    p.x = Math.min(Math.max(p.x, M - l - tx), innerWidth - M - l - tx - w);
    p.y = Math.min(Math.max(p.y, M - t), innerHeight - M - t - h);
    apply(name, el);
  }

  for (const [name, sel] of Object.entries(WINS)){
    const el = document.querySelector(sel); if (!el) continue;
    el.classList.add("mv");
    const g = document.createElement("button");
    g.type = "button"; g.className = "grip";
    g.title = "Ziehen zum Verschieben · Doppelklick: zurücksetzen";
    g.setAttribute("aria-label", "Fenster verschieben");
    el.prepend(g);
    apply(name, el);

    let start = null;
    const down = e => {
      if (small() || e.button !== 0) return;
      if (e.currentTarget !== g && e.target.closest("button,a,input,select,textarea")) return;
      const p = pos[name] || { x: 0, y: 0 };
      start = { x: e.clientX, y: e.clientY, px: p.x, py: p.y, moved: false, id: e.pointerId, src: e.currentTarget };
      e.currentTarget.setPointerCapture(e.pointerId);
      e.preventDefault();
    };
    const move = e => {
      if (!start || e.pointerId !== start.id) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!start.moved && Math.hypot(dx, dy) < 4) return;
      start.moved = true; el.classList.add("dragging");
      pos[name] = { x: start.px + dx, y: start.py + dy };
      clamp(name, el);
    };
    const up = e => {
      if (!start || e.pointerId !== start.id) return;
      if (start.moved){ saveAll(); if (name === "blatt") dispatchEvent(new Event("resize")); }
      el.classList.remove("dragging"); start = null;
    };
    for (const t of name === "top" ? [g, el] : [g]){
      t.addEventListener("pointerdown", down);
      t.addEventListener("pointermove", move);
      t.addEventListener("pointerup", up);
      t.addEventListener("pointercancel", up);
    }
    g.addEventListener("click", e => e.stopPropagation());
    g.addEventListener("dblclick", e => { e.stopPropagation(); delete pos[name]; saveAll(); apply(name, el); dispatchEvent(new Event("resize")); });
    // Inhalt des Blatts wechselt seine Höhe: trotzdem im Bild bleiben
    new ResizeObserver(() => clamp(name, el)).observe(el);
  }
  // Seitenblatt geschlossen: nach der Schließ-Animation zurück an den Ursprungsort
  const sheet = document.querySelector(".panel");
  let wasOpen = document.body.classList.contains("sheet-open"), back = 0;
  new MutationObserver(() => {
    const open = document.body.classList.contains("sheet-open");
    if (wasOpen && !open && pos.blatt){
      clearTimeout(back);
      back = setTimeout(() => { if (!document.body.classList.contains("sheet-open")){ delete pos.blatt; apply("blatt", sheet); } }, 450);
    }
    if (open) clearTimeout(back);
    wasOpen = open;
  }).observe(document.body, { attributes: true, attributeFilter: ["class"] });
  addEventListener("resize", () => {
    for (const [name, sel] of Object.entries(WINS)){ const el = document.querySelector(sel); if (el){ apply(name, el); clamp(name, el); } }
  });

  // Vorschaufenster: am Griff oben rechts größer/kleiner ziehen (unten links bleibt stehen)
  const pv = document.getElementById("pv"), rs = document.getElementById("pvRs");
  const setW = w => { if (w) pv.style.setProperty("--pvw", Math.round(w) + "px"); else pv.style.removeProperty("--pvw"); };
  setW(load(PVKEY));
  let rz = null;
  rs.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    const r = pv.getBoundingClientRect();
    rz = { id: e.pointerId, left: r.left, bottom: r.bottom, ratio: r.height / r.width };
    rs.setPointerCapture(e.pointerId); pv.classList.add("resizing"); e.preventDefault(); e.stopPropagation();
  });
  rs.addEventListener("pointermove", e => {
    if (!rz || e.pointerId !== rz.id) return;
    const maxW = Math.min(innerWidth - rz.left - 14, (rz.bottom - 14) / rz.ratio);
    setW(Math.max(260, Math.min(maxW, e.clientX - rz.left)));
  });
  const end = e => {
    if (!rz || e.pointerId !== rz.id) return;
    rz = null; pv.classList.remove("resizing");
    save(PVKEY, parseFloat(pv.style.getPropertyValue("--pvw")) || null);
  };
  rs.addEventListener("pointerup", end); rs.addEventListener("pointercancel", end);
  rs.addEventListener("click", e => e.stopPropagation());
  rs.addEventListener("dblclick", e => { e.stopPropagation(); setW(null); save(PVKEY, null); });
})();
</script>
